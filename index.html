<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Segunda Partida · Revista digital</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191918;color:#fff;font:16px system-ui,sans-serif}header,nav{display:flex;align-items:center;gap:1rem;padding:12px 4vw}header{justify-content:space-between;border-bottom:1px solid #45453e}h1{font:700 1.35rem Georgia,serif;margin:0}a{color:#ffc691}main{margin:12px auto;width:min(96vw,calc(70.7dvh - 95px));position:relative;aspect-ratio:595.5/842.25;perspective:1400px;touch-action:pan-y pinch-zoom}img{display:block;width:100%;height:100%;box-shadow:0 6px 24px #0008;user-select:none}.giro{position:absolute;inset:0;transform-origin:left center;pointer-events:none}nav{justify-content:center}button{background:#ffc691;border:0;border-radius:4px;padding:10px 14px;color:#25190f;font:inherit;cursor:pointer}button:disabled{opacity:.4}output{white-space:nowrap}
</style>
<header><h1>Segunda Partida</h1><a href="revista.pdf">Abrir PDF</a></header>
<main><img id="hoja" src="pagina-1.jpg" alt="Portada de Segunda Partida" draggable="false"></main>
<nav aria-label="Páginas"><button id="anterior" disabled>← Anterior</button><output id="contador" aria-live="polite">1 / 9</output><button id="siguiente">Siguiente →</button></nav>
<script>
const total = 9;
const marco = document.querySelector('main');
const hoja = document.querySelector('#hoja');
const anterior = document.querySelector('#anterior');
const siguiente = document.querySelector('#siguiente');
const contador = document.querySelector('#contador');
let pagina = 1, ocupado = false;
async function pasar(sentido) {
  const destino = pagina + sentido;
  if (ocupado || destino < 1 || destino > total) return;
  ocupado = true;
  let capa;
  try {
    const nueva = new Image();
    nueva.src = 'pagina-' + destino + '.jpg';
    await nueva.decode();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && hoja.animate) {
      capa = sentido > 0 ? hoja.cloneNode() : nueva;
      capa.removeAttribute('id');
      capa.alt = '';
      capa.className = 'giro';
      marco.append(capa);
      if (sentido > 0) hoja.src = nueva.src;
      const plana = {transform:'rotateY(0deg)',filter:'brightness(1)'};
      const doblada = {transform:'rotateY(-90deg)',filter:'brightness(.68)'};
      await capa.animate(sentido > 0 ? [plana,doblada] : [doblada,plana], {duration:440,easing:'ease-in-out',fill:'forwards'}).finished;
    }
    hoja.src = nueva.src;
    hoja.alt = 'Segunda Partida, página ' + destino;
    pagina = destino;
    contador.textContent = pagina + ' / ' + total;
  } catch {
    hoja.src = 'pagina-' + pagina + '.jpg';
    contador.textContent = 'Reintenta o abre el PDF';
  } finally {
    capa?.remove();
    ocupado = false;
    anterior.disabled = pagina === 1;
    siguiente.disabled = pagina === total;
  }
}
anterior.onclick = () => pasar(-1);
siguiente.onclick = () => pasar(1);
document.addEventListener('keydown', evento => {
  if (evento.key === 'ArrowLeft') pasar(-1);
  if (evento.key === 'ArrowRight') pasar(1);
});
let inicio;
marco.onpointerdown = e => {
  inicio = e.isPrimary ? [e.clientX,e.clientY] : null;
  marco.setPointerCapture(e.pointerId);
};
marco.onpointercancel = () => { inicio = null; };
marco.onpointerup = e => {
  if (!inicio) return;
  const dx = e.clientX - inicio[0], dy = e.clientY - inicio[1];
  inicio = null;
  if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) pasar(dx < 0 ? 1 : -1);
};
</script></html>
