<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191b18"><title>Segunda Partida · Edición 01</title><style>
*{box-sizing:border-box}body{margin:0;background:#191b18;color:#f7f3e9;font:16px system-ui,sans-serif}header,main{max-width:1460px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:20px 5vw;border-bottom:1px solid #53544e}header strong{font:italic bold 22px Georgia,serif}header a{color:inherit;text-decoration:none;border:1px solid #77796f;border-radius:30px;padding:8px 17px}main{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);gap:5vw;padding:32px 5vw;align-items:center}.edicion{letter-spacing:.13em;font:13px monospace;color:#ffab77}h1{font:normal clamp(54px,7vw,108px)/.88 Georgia,serif;letter-spacing:-.065em;margin:24px 0}h1 em{color:#ffac77}h2{font:normal clamp(20px,2.1vw,32px)/1.18 Georgia,serif;max-width:21ch}.firma{color:#d1d2c8;font-size:14px;margin:22px 0 35px}label{font:13px monospace;display:block;margin-bottom:8px}select{background:#292c26;border:1px solid #73766a;border-radius:8px;color:#fff;padding:12px;max-width:100%;font-size:16px}.lector{background:radial-gradient(ellipse at 50% 25%,#515349,#30342c 75%);border:1px solid #56594e;border-radius:20px;padding:22px 12px 12px;min-width:0}figure{position:relative;margin:0 auto;width:min(96%,calc(67dvh * .707));aspect-ratio:595.5/842.25;perspective:1400px;touch-action:pan-y pinch-zoom;box-shadow:3px 3px #d3cdbb,6px 6px #68685d,0 15px 28px #0006}figure img{width:100%;height:100%;display:block;user-select:none}.giro{position:absolute;inset:0;transform-origin:left center;pointer-events:none}nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:19px auto 0}button{border:0;border-radius:24px;padding:10px 17px;background:#ffac77;color:#201a15;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.4}output{font:14px monospace}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:3px}@media(max-width:720px){header{padding:12px 4vw}main{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:16px 3vw}.intro{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.edicion{margin:0}.intro h1,.intro h2,.intro .firma{display:none}.indice label{font-size:12px}.indice select{max-width:52vw;padding:7px}.lector{padding:13px 7px}figure{width:min(98%,55vh)}}
</style></head><body><header><strong>Segunda Partida</strong><a href="revista.pdf">Abrir PDF ↗</a></header><main><section class="intro"><p class="edicion">EDICIÓN 01 · NOV 2026</p><h1>Segunda<br><em>Partida</em></h1><h2>¿Cuánto vale una consola que ya no enciende?</h2><p class="firma">Por Yessica Cuevas · Formación Empresarial</p><div class="indice"><label for="indice">Índice de la revista</label><select id="indice"><option value="1">01 · Portada</option><option value="2">02 · Introducción y biografías</option><option value="3">03 · Antes de abrir la consola</option><option value="4">04 · La cuenta del taller</option><option value="5">05 · ¿Comprarías esta consola?</option><option value="6">06 · La etiqueta de salida</option><option value="7">07 · Fuentes y créditos</option><option value="8">08 · Mi ficha de evaluación</option><option value="9">09 · Nota de autora</option></select></div></section><section class="lector" aria-label="Lector de revista"><figure><img id="hoja" src="pagina-1.jpg" alt="Portada de Segunda Partida" draggable="false"></figure><nav aria-label="Páginas"><button id="anterior" disabled>← Anterior</button><output id="contador" aria-live="polite">1 / 9</output><button id="siguiente">Siguiente →</button></nav></section></main><script>
const total = 9;
const marco = document.querySelector('figure');
const hoja = document.querySelector('#hoja');
const anterior = document.querySelector('#anterior');
const siguiente = document.querySelector('#siguiente');
const contador = document.querySelector('#contador');
let pagina = 1, ocupado = false;
async function pasar(sentido) {
  const destino = pagina + sentido;
  if (ocupado || destino < 1 || destino > total) return;
  ocupado = true;
  let capa;
  try {
    const nueva = new Image();
    nueva.src = 'pagina-' + destino + '.jpg';
    await nueva.decode();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && hoja.animate) {
      capa = sentido > 0 ? hoja.cloneNode() : nueva;
      capa.removeAttribute('id');
      capa.alt = '';
      capa.className = 'giro';
      marco.append(capa);
      if (sentido > 0) hoja.src = nueva.src;
      const plana = {transform:'rotateY(0deg)',filter:'brightness(1)'};
      const doblada = {transform:'rotateY(-90deg)',filter:'brightness(.68)'};
      await capa.animate(sentido > 0 ? [plana,doblada] : [doblada,plana], {duration:440,easing:'ease-in-out',fill:'forwards'}).finished;
    }
    hoja.src = nueva.src;
    hoja.alt = 'Segunda Partida, página ' + destino;
    pagina = destino;
    indice.value = pagina;
    contador.textContent = pagina + ' / ' + total;
  } catch {
    hoja.src = 'pagina-' + pagina + '.jpg';
    contador.textContent = 'Reintenta o abre el PDF';
  } finally {
    indice.value = pagina;
    capa?.remove();
    ocupado = false;
    anterior.disabled = pagina === 1;
    siguiente.disabled = pagina === total;
  }
}
anterior.onclick = () => pasar(-1);
siguiente.onclick = () => pasar(1);
document.addEventListener('keydown', evento => {
  if (evento.target === indice || evento.altKey || evento.ctrlKey || evento.metaKey) return;
  if (evento.key === 'ArrowLeft') pasar(-1);
  if (evento.key === 'ArrowRight') pasar(1);
});
let inicio;
marco.onpointerdown = e => {
  inicio = e.isPrimary ? [e.clientX,e.clientY] : null;
  marco.setPointerCapture(e.pointerId);
};
marco.onpointercancel = () => { inicio = null; };
marco.onpointerup = e => {
  if (!inicio) return;
  const dx = e.clientX - inicio[0], dy = e.clientY - inicio[1];
  inicio = null;
  if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) pasar(dx < 0 ? 1 : -1);
};

const indice = document.querySelector('select');
indice.onchange = () => pasar(Number(indice.value) - pagina);
</script></body></html>
